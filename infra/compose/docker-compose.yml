version: '3.8'

networks:
  syntrae_net:
    driver: bridge

services:
  # =========================
  # INFRASTRUCTURE
  # =========================

  postgresql:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: syntrae_core
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:-/mnt/data/docker/postgres}:/var/lib/postgresql/data
      - ../docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - syntrae_net

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U superuser -d syntrae_core" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - /mnt/data/docker/redis:/data
    networks:
      - syntrae_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.5.0
    restart: unless-stopped
    volumes:
      - /mnt/data/docker/qdrant:/qdrant/storage
    networks:
      - syntrae_net

  # =========================
  # SERVICES
  # =========================

  db-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/db-migrate.Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}?schema=core
    depends_on:
      postgresql:
        condition: service_healthy
    # volumes:
    #   - ../../packages/prisma-schema:/app/packages/prisma-schema
    networks:
      - syntrae_net

  # =========================
  # APPS
  # =========================

  ai-core:
    build:
      context: ../..
      dockerfile: infra/docker/ai-core.Dockerfile
    restart: unless-stopped
    environment:
      # Adjusted to use 'postgresql' service and create user/db in init
      # Note: ai-core uses 'chatbot_user' which is the POSTGRES_USER.
      - DATABASE_URL=${DATABASE_URL}?options=-c%20search_path%3Dcore
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET}
      - RAG_EMBED_MODEL=text-embedding-3-large
      - RAG_CHAT_MODEL=gpt-4o-mini
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syntrae_net

  ingestion-service:
    build:
      context: ../..
      dockerfile: infra/docker/ingestion-service.Dockerfile
    container_name: ingestion-service
    restart: unless-stopped
    # PILOT SECURITY: Removed public port binding - only accessible via internal network
    # Public access blocked, automation (video-detection-engine) uses http://ingestion-service:3005
    # ports:
    #   - "3006:3005"
    volumes:
      # Mount data if needed, but relative path might be tricky. Using named volume or omitting for now unless critical.
      # Original: ./ingestion-service/data:/app/data. 
      # We can map it to a local folder in infra/compose/data/ingestion?
      - ./data/ingestion:/app/data
    networks:
      - syntrae_net
    environment:
      - LOG_LEVEL=info # Pilot: reduced from debug
      # - DEBUG=*  # Pilot: disabled verbose debugging
      - PORT=3005
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}?schema=core
      - AI_CORE_BASE_URL=http://ai-core:8000
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET}
      - AI_ENGAGEMENT_INTERNAL_SECRET=${AI_ENGAGEMENT_INTERNAL_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgresql
      - ai-core

  operator-api:
    build:
      context: ../..
      dockerfile: infra/docker/operator-api.Dockerfile
    container_name: operator-api
    restart: unless-stopped
    # PORTS REMOVED: Exposed only internally via network
    # ports:
    #   - "3001:3001"
    volumes:
      - /mnt/data/docker/video:/data/storage
    networks:
      - syntrae_net
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}?schema=core
      - JWT_SECRET=${JWT_SECRET}
      - AI_CORE_BASE_URL=http://ai-core:8000
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET}
      # NGINX is now the edge
      - TRUST_PROXY=true
      - COOKIE_DOMAIN=.syntraeai.com
      - COOKIE_SECURE=true
      - APP_BASE_URL=${APP_BASE_URL:-https://app.syntraeai.com}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://syntraeai.com}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-support@syntraeai.com}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Syntrae}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - XHS_SESSION_ENCRYPTION_KEY=${XHS_SESSION_ENCRYPTION_KEY}
      - EMAIL_VERIFICATION_EXPIRY_MINUTES=${EMAIL_VERIFICATION_EXPIRY_MINUTES:-1440}
      - PASSWORD_RESET_EXPIRY_MINUTES=${PASSWORD_RESET_EXPIRY_MINUTES:-60}
      - BETA_SIGNUP_ENABLED=${BETA_SIGNUP_ENABLED:-false}
      - BETA_SIGNUP_ALLOWLIST=${BETA_SIGNUP_ALLOWLIST}
      - AUTH_BYPASS_ENABLE=0
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PORTAL_RETURN_URL=${STRIPE_PORTAL_RETURN_URL:-https://app.syntraeai.com/billing}
      - STRIPE_CHECKOUT_SUCCESS_URL=${STRIPE_CHECKOUT_SUCCESS_URL:-https://app.syntraeai.com/billing?checkout=success}
      - STRIPE_CHECKOUT_CANCEL_URL=${STRIPE_CHECKOUT_CANCEL_URL:-https://app.syntraeai.com/billing?checkout=canceled}
      - STRIPE_PRICE_STARTER_MONTHLY=${STRIPE_PRICE_STARTER_MONTHLY}
      - STRIPE_PRICE_STARTER_YEARLY=${STRIPE_PRICE_STARTER_YEARLY}
      - STRIPE_PRICE_GROWTH_MONTHLY=${STRIPE_PRICE_GROWTH_MONTHLY}
      - STRIPE_PRICE_GROWTH_YEARLY=${STRIPE_PRICE_GROWTH_YEARLY}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_YEARLY=${STRIPE_PRICE_PRO_YEARLY}
      - STRIPE_PRICE_AGENCY_MONTHLY=${STRIPE_PRICE_AGENCY_MONTHLY}
      - STRIPE_PRICE_AGENCY_YEARLY=${STRIPE_PRICE_AGENCY_YEARLY}
      - BILLING_MANUAL_PLAN_CHANGES=${BILLING_MANUAL_PLAN_CHANGES:-0}
      - AUTOMATION_STORAGE_ROOT=/data/storage
      - AUTOMATION_API_URL=http://video-detection-engine:8000
    depends_on:
      - postgresql

  operator-ui:
    build:
      context: ../..
      dockerfile: infra/docker/operator-ui.Dockerfile
    container_name: operator-ui
    restart: unless-stopped
    # PORTS REMOVED: Exposed only internally via network
    # ports:
    #   - "5173:80"
    networks:
      - syntrae_net
    depends_on:
      - operator-api

  # =========================
  # EDGE & PROXY
  # =========================

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/proxy_params:/etc/nginx/proxy_params
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - syntrae_net
    depends_on:
      - operator-api
      - operator-ui
      # Ensure config valid before start? NGINX handles it.

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Daily renewal check
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  video-detection-engine:
    build:
      context: ../..
      dockerfile: infra/docker/video-detection-engine.Dockerfile
    container_name: video-detection-engine
    volumes:
      - /mnt/data/docker/video:/data/storage
      - ${HOME}/screenshots:/data/screenshots # Debug artifacts
    environment:
      - LOG_LEVEL=INFO
      - DEBUG_ARTIFACTS_DIR=/data/screenshots
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET}
      - AI_CORE_BASE_URL=http://ai-core:8000
      - INGESTION_URL=http://ingestion-service:3005 # PILOT SECURITY: Internal network
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
    restart: unless-stopped
    networks:
      - syntrae_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  automation-worker:
    # Reuses the same build context/image
    build:
      context: ../..
      dockerfile: infra/docker/video-detection-engine.Dockerfile
    # Do not set container_name so Compose can scale this service horizontally.
    command:
      - /bin/sh
      - -lc
      - python poll_automation.py --mode global --install-id "$${AUTOMATION_WORKER_ID:-automation-worker-$${HOSTNAME}}"
    volumes:
      - /mnt/data/docker/video:/data/storage
      - ${HOME}/screenshots:/data/screenshots # Debug artifacts
    environment:
      - LOG_LEVEL=INFO
      - DEBUG_ARTIFACTS_DIR=/data/screenshots
      # Needs to reach operator-api for polling
      - OPERATOR_API_URL=http://operator-api:3001
      # Internal Service Links
      - AI_CORE_BASE_URL=http://ai-core:8000 # FIX: was AI_CORE_URL, code expects AI_CORE_BASE_URL
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET}
      - INGESTION_URL=http://ingestion-service:3005 # PILOT SECURITY: Internal network
      - AUTOMATION_STORAGE_ROOT=/data/storage
      - AUTOMATION_LEASE_SECONDS=${AUTOMATION_LEASE_SECONDS:-120}
      - AUTOMATION_HEARTBEAT_SECONDS=${AUTOMATION_HEARTBEAT_SECONDS:-30}
      - AUTOMATION_POLL_SECONDS=${AUTOMATION_POLL_SECONDS:-5}
      - AUTOMATION_SWEEP_SECONDS=${AUTOMATION_SWEEP_SECONDS:-60}
      - AUTOMATION_STALE_MINUTES=${AUTOMATION_STALE_MINUTES:-10}
      - AUTOMATION_STALE_RETRY_DELAY_SECONDS=${AUTOMATION_STALE_RETRY_DELAY_SECONDS:-30}
      - AUTOMATION_STALE_MAX_ATTEMPTS=${AUTOMATION_STALE_MAX_ATTEMPTS:-3}
      - AUTOMATION_STALE_SWEEP_LIMIT=${AUTOMATION_STALE_SWEEP_LIMIT:-25}
      # Testing Overrides
      - MOCK_TIKTOK_COMMENTS=${MOCK_TIKTOK_COMMENTS:-Sample captured comment}
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
    restart: unless-stopped
    depends_on:
      - operator-api
    networks:
      - syntrae_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
