server {
    listen 80;
    server_name app.localhost.com;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $operator_api_upstream http://operator-api:3001;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_set_header Host api.localhost.com;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass $operator_api_upstream;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 80;
    server_name api.localhost.com;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $operator_api_upstream http://operator-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass $operator_api_upstream;
    }
}

server {
    listen 443 ssl;
    server_name app.localhost.com;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/local/app.localhost.com.pem;
    ssl_certificate_key /etc/nginx/local/app.localhost.com-key.pem;

    location /api/ {
        set $operator_api_upstream http://operator-api:3001;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_set_header Host api.localhost.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass $operator_api_upstream;
    }

    location / {
        set $operator_ui_upstream http://operator-ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass $operator_ui_upstream;
    }
}

server {
    listen 443 ssl;
