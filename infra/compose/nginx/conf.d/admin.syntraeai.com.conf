server {
    listen 80;
    server_name admin.syntraeai.com;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $admin_ui_upstream http://admin-ui:80;
        proxy_pass $admin_ui_upstream;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    server_name admin.syntraeai.com;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/app.syntraeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.syntraeai.com/privkey.pem;

    location / {
        set $admin_ui_upstream http://admin-ui:80;
        proxy_pass $admin_ui_upstream;
        include /etc/nginx/proxy_params;
    }
}
