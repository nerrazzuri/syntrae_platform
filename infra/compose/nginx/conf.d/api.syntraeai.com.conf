server {
    listen 80;
    server_name api.syntraeai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.syntraeai.com;
    
    ssl_certificate /etc/letsencrypt/live/app.syntraeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.syntraeai.com/privkey.pem;

    include /etc/nginx/proxy_params;

    location / {
        proxy_pass http://operator-api:3001;
   }
}
