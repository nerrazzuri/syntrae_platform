server {
    listen 80;
    server_name syntraeai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name syntraeai.com;
    
    ssl_certificate /etc/letsencrypt/live/syntraeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syntraeai.com/privkey.pem;

    include /etc/nginx/proxy_params;

    location / {
        # Redirect root to app for now, or serve landing if available
        # User requested: "frontend (marketing / landing)"
        proxy_pass http://operator-ui:80;
    }
}
