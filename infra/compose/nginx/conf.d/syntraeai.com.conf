server {
    listen 80;
    server_name syntraeai.com www.syntraeai.com;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    if ($host = www.syntraeai.com) {
        return 301 https://syntraeai.com$request_uri;
    }

    location / {
        set $marketing_ui_upstream http://marketing-ui:80;
        proxy_pass $marketing_ui_upstream;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    server_name syntraeai.com www.syntraeai.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
   
    ssl_certificate /etc/letsencrypt/live/app.syntraeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.syntraeai.com/privkey.pem;

    if ($host = www.syntraeai.com) {
        return 301 https://syntraeai.com$request_uri;
    }

    location / {
        set $marketing_ui_upstream http://marketing-ui:80;
        proxy_pass $marketing_ui_upstream;
        include /etc/nginx/proxy_params;
    }
}
