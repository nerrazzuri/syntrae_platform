version: '3.8'

networks:
  syntrae_local_net:
    driver: bridge

services:
  # =========================
  # INFRASTRUCTURE
  # =========================

  postgresql:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: syntrae_core
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    volumes:
      - ./local-data/postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - syntrae_local_net

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U superuser -d syntrae_core" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - ./local-data/redis:/data
    networks:
      - syntrae_local_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.5.0
    restart: unless-stopped
    volumes:
      - ./local-data/qdrant:/qdrant/storage
    networks:
      - syntrae_local_net
    ports:
      - "6333:6333" # Qdrant API
      - "6334:6334" # Qdrant gRPC

  # =========================
  # SERVICES
  # =========================

  db-migrate:
    build:
      context: .
      dockerfile: infra/docker/db-migrate.Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://superuser:local_dev_password@postgresql:5432/syntrae_core}?schema=core
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - syntrae_local_net

  # =========================
  # APPS
  # =========================

  ai-core:
    build:
      context: .
      dockerfile: infra/docker/ai-core.Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://superuser:local_dev_password@postgresql:5432/syntrae_core}?options=-c%20search_path%3Dcore
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET:-local_dev_secret}
      - RAG_EMBED_MODEL=text-embedding-3-large
      - RAG_CHAT_MODEL=gpt-4o-mini
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syntrae_local_net
    ports:
      - "8000:8000"

  ingestion-service:
    build:
      context: .
      dockerfile: infra/docker/ingestion-service.Dockerfile
    container_name: ingestion-service-local
    restart: unless-stopped
    ports:
      - "3005:3005" # Publicly exposed for local debugging
    volumes:
      - ./local-data/ingestion:/app/data
    networks:
      - syntrae_local_net
    environment:
      - LOG_LEVEL=debug 
      - PORT=3005
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-postgresql://superuser:local_dev_password@postgresql:5432/syntrae_core}?schema=core
      - AI_CORE_BASE_URL=http://ai-core:8000
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET:-local_dev_secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgresql
      - ai-core

  operator-api:
    build:
      context: .
      dockerfile: infra/docker/operator-api.Dockerfile
    container_name: operator-api-local
    restart: unless-stopped
    ports:
      - "3001:3001" # Exposed for local debugging
    networks:
      - syntrae_local_net
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-postgresql://superuser:local_dev_password@postgresql:5432/syntrae_core}?schema=core
      - JWT_SECRET=dev_secret_operator_key_123
      - AI_CORE_BASE_URL=http://ai-core:8000
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET:-local_dev_secret}
      - COOKIE_DOMAIN=localhost
    depends_on:
      - postgresql

  operator-ui:
    build:
      context: .
      dockerfile: infra/docker/operator-ui.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: operator-ui-local
    restart: unless-stopped
    ports:
      - "8080:80" # Exposed on 8080 locally to avoid conflict with default 80
    networks:
      - syntrae_local_net
    depends_on:
      - operator-api

  video-detection-engine:
    build:
      context: .
      dockerfile: infra/docker/video-detection-engine.Dockerfile
    container_name: video-detection-engine-local
    volumes:
      - ./local-data/video:/data/storage
      - ./local-data/screenshots:/data/screenshots
    environment:
      - LOG_LEVEL=DEBUG
      - DEBUG_ARTIFACTS_DIR=/data/screenshots
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET:-local_dev_secret}
      - AI_CORE_BASE_URL=http://ai-core:8000
      - INGESTION_URL=http://ingestion-service:3005
      - PROXY_ENABLED=true
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
    restart: unless-stopped
    networks:
      - syntrae_local_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  automation-worker:
    build:
      context: .
      dockerfile: infra/docker/video-detection-engine.Dockerfile
    container_name: automation-worker-local
    command:
      - /bin/sh
      - -lc
      - python poll_automation.py --mode global --install-id "$${AUTOMATION_WORKER_ID:-docker-worker-local-1}"
    volumes:
      - ./local-data/video:/data/storage
      - ./local-data/screenshots:/data/screenshots
      - ./local-data/xiaohongshu-cli:/root/.xiaohongshu-cli
    environment:
      - LOG_LEVEL=DEBUG
      - DEBUG_ARTIFACTS_DIR=/data/screenshots
      - OPERATOR_API_URL=http://operator-api:3001
      - AI_CORE_BASE_URL=http://ai-core:8000 
      - AI_CORE_INTERNAL_SECRET=${AI_CORE_INTERNAL_SECRET:-local_dev_secret}
      - INGESTION_URL=http://ingestion-service:3005 
      - AUTOMATION_STORAGE_ROOT=/data/storage
      - AUTOMATION_LEASE_SECONDS=${AUTOMATION_LEASE_SECONDS:-120}
      - AUTOMATION_HEARTBEAT_SECONDS=${AUTOMATION_HEARTBEAT_SECONDS:-30}
      - AUTOMATION_POLL_SECONDS=${AUTOMATION_POLL_SECONDS:-5}
      - AUTOMATION_SWEEP_SECONDS=${AUTOMATION_SWEEP_SECONDS:-60}
      - AUTOMATION_STALE_MINUTES=${AUTOMATION_STALE_MINUTES:-10}
      - AUTOMATION_STALE_RETRY_DELAY_SECONDS=${AUTOMATION_STALE_RETRY_DELAY_SECONDS:-30}
      - AUTOMATION_STALE_MAX_ATTEMPTS=${AUTOMATION_STALE_MAX_ATTEMPTS:-3}
      - AUTOMATION_STALE_SWEEP_LIMIT=${AUTOMATION_STALE_SWEEP_LIMIT:-25}
      - MOCK_TIKTOK_COMMENTS=${MOCK_TIKTOK_COMMENTS:-Sample captured comment}
      - PROXY_ENABLED=true
      - PROXY_SERVER=${PROXY_SERVER}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
    restart: unless-stopped
    depends_on:
      - operator-api
    networks:
      - syntrae_local_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
