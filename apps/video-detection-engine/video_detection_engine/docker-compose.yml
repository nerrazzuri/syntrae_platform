version: '3.8'

services:
  video-engine:
    build: .
    container_name: video_detection_engine
    ports:
      - "8000:8000"
    volumes:
      - .:/app # Mount code for easy development/testing
      - ./data_storage:/data/storage # Persist storage
      - ${HOME}/screenshots:/data/screenshots # Debug artifacts
    environment:
      - LOG_LEVEL=INFO
      - DEBUG_ARTIFACTS_DIR=/data/screenshots
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
